<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 230" role="img" aria-label="Child lying on their side in the recovery position">
<rect width="360" height="230" rx="16" fill="#f5f3fe"/>
<path d="M14 150 Q180 132 346 150 L346 214 Q180 226 14 214 Z" fill="#e6e1fb"/>
<ellipse cx="190" cy="176" rx="150" ry="16" fill="#cfc6f5" opacity=".7"/>
<g stroke-linecap="round" stroke-linejoin="round" fill="none">
 <!-- bottom leg (straight, behind) -->
 <path d="M200 140 L322 146" stroke="#1f2b52" stroke-width="27"/>
 <path d="M200 140 L322 146" stroke="#33467f" stroke-width="22"/>
 <path d="M322 146 L338 140" stroke="#1b2140" stroke-width="13"/>
 <!-- bottom arm (out in front, palm up) -->
 <path d="M118 150 L116 192 L88 202" stroke="#5a3fc4" stroke-width="19"/>
 <path d="M118 150 L116 192 L88 202" stroke="#8a6cf2" stroke-width="14"/>
 <path d="M104 197 L80 205" stroke="#e0ab84" stroke-width="13"/>
 <!-- torso -->
 <path d="M86 132 L100 134" stroke="#d9a47e" stroke-width="16"/><path d="M86 132 L100 134" stroke="#f1c7a3" stroke-width="12"/>
 <path d="M96 124 C104 114 128 112 146 118 C160 122 172 124 186 121 C204 118 220 124 222 138 C224 152 210 160 192 158 C172 156 160 158 144 160 C124 163 102 160 96 150 C92 142 92 132 96 124 Z" fill="#8a6cf2" stroke="#5a3fc4" stroke-width="3"/>
 <!-- top leg (bent forward, knee on floor) -->
 <path d="M204 136 L236 186 L296 190" stroke="#1f2b52" stroke-width="29"/>
 <path d="M204 136 L236 186 L296 190" stroke="#3f57a0" stroke-width="24"/>
 <path d="M296 190 L314 186" stroke="#1b2140" stroke-width="14"/>
 <!-- top arm: across chest, hand under cheek -->
 <path d="M126 128 L104 168 L64 160" stroke="#5a3fc4" stroke-width="19"/>
 <path d="M126 128 L104 168 L64 160" stroke="#9b80f6" stroke-width="14"/>
</g>
<!-- head -->
<circle cx="70" cy="128" r="25" fill="#f1c7a3" stroke="#d9a47e" stroke-width="2"/>
<path d="M58 106 C78 96 100 110 95 132 C92 126 86 120 80 118 C74 114 64 112 58 106 Z" fill="#4a3426"/>
<path d="M58 106 C66 100 76 100 84 104" stroke="#4a3426" stroke-width="6" fill="none" stroke-linecap="round"/>
<circle cx="58" cy="124" r="2.4" fill="#1b2140"/>
<path d="M53 116 q5 -3 10 0" stroke="#4a3426" stroke-width="1.6" fill="none" stroke-linecap="round"/>
<path d="M50 137 q4 3 8 1" stroke="#a0525a" stroke-width="2" fill="none" stroke-linecap="round"/>
<!-- top hand under cheek -->
<ellipse cx="62" cy="156" rx="13" ry="7" fill="#f1c7a3" stroke="#d9a47e" stroke-width="2" transform="rotate(-8 62 156)"/>
<g font-family="Inter,system-ui,sans-serif" font-size="11.5" fill="#1b2140">
 <g stroke="#5b3fd8" stroke-width="1.3" fill="none"><path d="M30 46 L46 104"/><path d="M168 30 L80 152"/><path d="M262 82 L240 168"/><path d="M40 214 L82 204"/><path d="M300 108 L310 140"/></g>
 <g fill="#5b3fd8"><circle cx="46" cy="104" r="2.6"/><circle cx="80" cy="152" r="2.6"/><circle cx="240" cy="168" r="2.6"/><circle cx="82" cy="204" r="2.6"/><circle cx="310" cy="140" r="2.6"/></g>
 <text x="10" y="22" font-weight="700">Head tilted back,</text><text x="10" y="37">chin up – airway open</text>
 <text x="150" y="22" font-weight="700">Top hand under cheek</text>
 <text x="232" y="62" font-weight="700">Top knee bent,</text><text x="232" y="76">resting on the floor</text>
 <text x="262" y="104" font-weight="700" text-anchor="end" dx="76">Bottom leg straight</text>
 <text x="10" y="226" font-weight="700" dy="-6" x2="0">Bottom arm out, palm up</text>
</g>
</svg>
